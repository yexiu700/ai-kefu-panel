name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-linux:
    name: Syntax & Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax check & cross-platform unit suites
        run: node scripts/run-tests.cjs

  unit-windows:
    name: Unit & PowerShell AST Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node & isolated PowerShell suites
        run: node scripts/run-tests.cjs --win
